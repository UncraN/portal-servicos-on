<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Contato - ON Notebooks e Celulares</title>

    <link rel="stylesheet" href="css/style.css">

</head>


<body>


<header>

    <h1>ON Notebooks e Celulares</h1>

    <p>Entre em contato conosco.</p>

</header>


<nav>

    <a href="index.html">Início</a>

    <a href="servicos.html">Serviços</a>

    <a href="contato.html">Contato</a>

</nav>


<main>


<section>

    <h2>Solicite um atendimento</h2>

    <p>
        Preencha os campos abaixo para registrar sua solicitação.
    </p>


    <form>


        <label for="nome">
            Nome:
        </label>

        <input
            type="text"
            id="nome"
            name="nome"
            required>


        <label for="email">
            E-mail:
        </label>

        <input
            type="email"
            id="email"
            name="email"
            required>


        <label for="telefone">
            Telefone:
        </label>

        <input
            type="text"
            id="telefone"
            name="telefone"
            required>


        <label for="assunto">
            Tipo de atendimento:
        </label>


        <select
            id="assunto"
            name="assunto"
            required>

            <option value="">
                Selecione
            </option>

            <option value="celular">
                Celular
            </option>

            <option value="notebook">
                Notebook
            </option>

            <option value="computador">
                Computador
            </option>

            <option value="console">
                Console ou Controle
            </option>

            <option value="vendas">
                Vendas
            </option>

        </select>


        <label for="mensagem">
            Descreva sua solicitação:
        </label>


        <textarea
            id="mensagem"
            name="mensagem"
            rows="5"
            required>
        </textarea>


        <button type="submit">
            Enviar
        </button>


    </form>

</section>


</main>


<footer>

    <p>
        ON Notebooks e Celulares
    </p>

    <p>
        Projeto acadêmico - Programação Web
    </p>

</footer>


</body>

</html>

<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Contato - ON Notebooks e Celulares</title>

    <link rel="stylesheet" href="css/style.css">
    <link rel="icon" type="image/png" href="img/logo.png">

</head>


<body>
<a class="pular-conteudo" href="#conteudo">Pular para o conteúdo</a>


<header>

    <h1>ON Notebooks e Celulares</h1>

    <p>Entre em contato conosco.</p>

</header>


<nav aria-label="Navegação principal">

    <a href="index.html">Início</a>

    <a href="servicos.html">Serviços</a>

    <a href="contato.html" aria-current="page">Contato</a>

</nav>


<main id="conteudo" tabindex="-1">


<section>

    <h2>Solicite um atendimento</h2>

    <p>
        Preencha os campos para testar a validação. Esta demonstração não envia nem salva sua solicitação.
    </p>


    <form id="formContato">


        <label for="nome">
            Nome:
        </label>

        <input
            type="text"
            id="nome"
            autocomplete="name"
            name="nome"
            required>


        <label for="email">
            E-mail:
        </label>

        <input
            type="email"
            id="email"
            autocomplete="email"
            name="email"
            required>


        <label for="telefone">
            Telefone:
        </label>

        <input
            type="tel"
            autocomplete="tel"
            id="telefone"
            name="telefone"
            required>


        <label for="assunto">
            Tipo de atendimento:
        </label>


        <select
            id="assunto"
            name="assunto"
            required>

            <option value="">
                Selecione
            </option>

            <option value="celular">
                Celular
            </option>

            <option value="notebook">
                Notebook
            </option>

            <option value="computador">
                Computador
            </option>

            <option value="console">
                Console ou Controle
            </option>

            <option value="vendas">
                Vendas
            </option>

        </select>


        <label for="mensagem">
            Descreva sua solicitação:
        </label>


        <textarea
            id="mensagem"
            name="mensagem"
            rows="5"
            required></textarea>


        <button type="submit">
            Enviar
        </button>


        <p id="mensagemForm" aria-live="polite"></p>

    </form>

</section>


</main>


<footer>

    <p>
        ON Notebooks e Celulares
    </p>

    <p>
        Projeto acadêmico - Programação Web
    </p>

</footer>


<script src="JS/contato.js"></script>
</body>

</html>

<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Serviços - ON Notebooks e Celulares</title>

    <link rel="stylesheet" href="css/style.css">

</head>

<body>


<header>

    <h1>ON Notebooks e Celulares</h1>

    <p>Conheça nossos principais serviços.</p>

</header>


<nav>

    <a href="index.html">Início</a>

    <a href="servicos.html">Serviços</a>

    <a href="contato.html">Contato</a>

</nav>


<main>

    <section>
        <h2>Catálogo de serviços</h2>
        <p>Veja os serviços oferecidos pela ON Notebooks e Celulares.</p>
        <label for="filtroCategoria">Filtrar serviços por categoria:</label>
        <select id="filtroCategoria" aria-controls="listaServicos">
            <option value="todos">Todos os serviços</option>
            <option value="software">Software</option>
            <option value="manutencao">Manutenção</option>
        </select>
        <p id="mensagemFiltro" aria-live="polite"></p>
        <div id="listaServicos" class="container-servicos"></div>
        <noscript>Ative o JavaScript para visualizar o catálogo de serviços.</noscript>
    </section>

    <section class="consulta-servico">

        <h2>Consulte um serviço</h2>

        <label for="servico">
            Escolha um serviço:
        </label>

        <select id="servico">

            <option value="">
                Selecione...
            </option>

            <option value="formatacao">
                Formatação de computadores
            </option>

            <option value="manutencao">
                Manutenção de computadores
            </option>

            <option value="programas">
                Instalação de programas
            </option>

        </select>


        <button id="btnConsultar" type="button">
            Consultar orientação
        </button>


        <p id="resultado" aria-live="polite"></p>

    </section>

</main>


<footer>

    <p>
        ON Notebooks e Celulares
    </p>

    <p>
        Projeto acadêmico - Programação Web
    </p>

</footer>
<script src="JS/script.js"></script>

</body>

</html>
